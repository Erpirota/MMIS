[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mmis"
version = "0.1.0"
description = "Minecraft Mod Intelligence Studio - offline modpack analysis and diagnostics"
requires-python = ">=3.14"
dependencies = [
    "PySide6-Essentials>=6.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyinstaller>=6.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mmis.ui" = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error::ResourceWarning",
]
